<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="2110" viewBox="0 0 1000 2110">
<rect width="1000" height="2110" fill="#FAFAF5"/>
<rect x="0" y="0" width="1000" height="225" fill="#123F35"/>
<rect x="64" y="55" width="12" height="120" fill="#EB9747"/>
<text x="100" y="90" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="white">Cómo aprende una IA</text>
<text x="100" y="145" font-family="Arial,sans-serif" font-size="44" font-weight="700" fill="white">a reconocer y crear imágenes</text>
<text x="100" y="190" font-family="Arial,sans-serif" font-size="21" fill="#CDE7D8">15 elementos para comprender la visión artificial</text>
<rect x="56" y="258" width="888" height="42" rx="9" fill="#DCECE1"/><text x="75" y="287" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13503A">FUNDAMENTOS</text><rect x="56" y="312" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="356" r="26" fill="#17664D"/><text x="99" y="364" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">01</text><text x="146" y="345" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Imagen digital y píxeles</text><text x="146" y="371" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Una imagen se forma con muchos puntos pequeños. Cada punto guarda información de luz o color.</text><rect x="56" y="412" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="456" r="26" fill="#17664D"/><text x="99" y="464" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">02</text><text x="146" y="445" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Resolución y color</text><text x="146" y="471" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">La resolución indica cuánto detalle vemos. El sistema RGB combina rojo, verde y azul para</text><text x="146" y="493" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">crear colores.</text><rect x="56" y="512" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="556" r="26" fill="#17664D"/><text x="99" y="564" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">03</text><text x="146" y="545" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Captura de imágenes</text><text x="146" y="571" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Una cámara o un sensor registra lo que ocurre y convierte la escena en datos digitales.</text><rect x="56" y="612" width="888" height="42" rx="9" fill="#DCECE1"/><text x="75" y="641" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13503A">PROCESAMIENTO</text><rect x="56" y="666" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="710" r="26" fill="#17664D"/><text x="99" y="718" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">04</text><text x="146" y="699" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Preparación de la imagen</text><text x="146" y="725" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Se ajusta el tamaño, la iluminación o el contraste para que el sistema pueda analizarla mejor.</text><rect x="56" y="766" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="810" r="26" fill="#17664D"/><text x="99" y="818" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">05</text><text x="146" y="799" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Reducción de ruido</text><text x="146" y="825" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Se atenúan manchas y variaciones que pueden confundir al programa, intentando conservar los</text><text x="146" y="847" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">detalles útiles.</text><rect x="56" y="866" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="910" r="26" fill="#17664D"/><text x="99" y="918" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">06</text><text x="146" y="899" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Segmentación</text><text x="146" y="925" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Consiste en separar las zonas importantes de una imagen, por ejemplo una hoja y el fondo.</text><rect x="56" y="966" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1010" r="26" fill="#17664D"/><text x="99" y="1018" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">07</text><text x="146" y="999" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Características visuales</text><text x="146" y="1025" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">El programa reconoce señales como formas, bordes, colores y texturas para describir lo que</text><text x="146" y="1047" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">aparece.</text><rect x="56" y="1066" width="888" height="42" rx="9" fill="#DCECE1"/><text x="75" y="1095" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13503A">APRENDIZAJE</text><rect x="56" y="1120" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1164" r="26" fill="#17664D"/><text x="99" y="1172" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">08</text><text x="146" y="1153" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Visión artificial</text><text x="146" y="1179" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Es la tecnología que permite a un computador analizar imágenes y extraer información de ellas.</text><rect x="56" y="1220" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1264" r="26" fill="#17664D"/><text x="99" y="1272" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">09</text><text x="146" y="1253" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Aprendizaje automático</text><text x="146" y="1279" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">El sistema aprende con muchos ejemplos en vez de recibir una regla específica para cada</text><text x="146" y="1301" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">situación.</text><rect x="56" y="1320" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1364" r="26" fill="#17664D"/><text x="99" y="1372" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">10</text><text x="146" y="1353" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Redes CNN</text><text x="146" y="1379" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Son modelos que aprenden a reconocer patrones de una imagen, desde bordes sencillos hasta</text><text x="146" y="1401" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">formas complejas.</text><rect x="56" y="1420" width="888" height="42" rx="9" fill="#DCECE1"/><text x="75" y="1449" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13503A">RECONOCIMIENTO Y GENERACIÓN</text><rect x="56" y="1474" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1518" r="26" fill="#17664D"/><text x="99" y="1526" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">11</text><text x="146" y="1507" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Clasificación</text><text x="146" y="1533" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Responde «¿qué tipo de imagen es?», por ejemplo «hoja sana» o «hoja enferma».</text><rect x="56" y="1574" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1618" r="26" fill="#17664D"/><text x="99" y="1626" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">12</text><text x="146" y="1607" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Detección de objetos</text><text x="146" y="1633" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Responde «¿qué hay y dónde está?». Señala la ubicación de los objetos encontrados.</text><rect x="56" y="1674" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1718" r="26" fill="#17664D"/><text x="99" y="1726" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">13</text><text x="146" y="1707" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Modelos generativos</text><text x="146" y="1733" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Aprenden cómo son las imágenes de entrenamiento y pueden producir imágenes nuevas.</text><rect x="56" y="1774" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1818" r="26" fill="#17664D"/><text x="99" y="1826" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">14</text><text x="146" y="1807" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">GAN y difusión</text><text x="146" y="1833" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Son dos formas de generar imágenes: unas comparan creaciones y otras parten de ruido y lo</text><text x="146" y="1855" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">refinan.</text><rect x="56" y="1874" width="888" height="42" rx="9" fill="#DCECE1"/><text x="75" y="1903" font-family="Arial,sans-serif" font-weight="700" font-size="20" fill="#13503A">USO EN EMPRESAS</text><rect x="56" y="1928" width="888" height="88" rx="10" fill="#FFFFFF" stroke="#D5E1D6"/><circle cx="99" cy="1972" r="26" fill="#17664D"/><text x="99" y="1980" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#FFFFFF">15</text><text x="146" y="1961" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#152E29">Aplicación empresarial</text><text x="146" y="1987" font-family="Arial,sans-serif" font-size="17" fill="#3B504B">Se usan para revisar productos y apoyar tareas como detectar daños en hojas o contar frutos.</text><text x="58" y="2046" font-family="Arial,sans-serif" font-size="18" fill="#30584B">Reconocer = identificar lo que existe. Generar = crear imágenes nuevas.</text>
<text x="58" y="2080" font-family="Arial,sans-serif" font-size="15" fill="#5B6F64">Fuentes: LeCun et al. (2015); Goodfellow et al. (2014); Ho et al. (2020).</text></svg>