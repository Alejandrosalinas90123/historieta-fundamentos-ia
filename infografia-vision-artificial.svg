<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1950" viewBox="0 0 900 1950"><rect width="900" height="1950" fill="#fffefa"/><text x="450" y="59" text-anchor="middle" font-size="37" font-family="Arial,sans-serif" font-weight="bold" fill="#101d18">Cómo aprende una IA</text><text x="450" y="102" text-anchor="middle" font-size="37" font-family="Arial,sans-serif" font-weight="bold" fill="#101d18">a reconocer y crear imágenes</text><rect x="30" y="132" width="840" height="38" rx="8" fill="#155d42"/><text x="48" y="159" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">FUNDAMENTOS</text><rect x="35" y="181" width="830" height="105" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="213" r="21" fill="#186a4a"/><text x="67" y="220" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">1</text><text x="100" y="211" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Imagen digital y píxeles</text><text x="100" y="239" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Una imagen digital está formada por píxeles.</text></rect><rect x="35" y="297" width="830" height="105" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="329" r="21" fill="#186a4a"/><text x="67" y="336" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">2</text><text x="100" y="327" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Resolución y color RGB</text><text x="100" y="355" font-family="Arial,sans-serif" font-size="18" fill="#424d46">La resolución define el detalle; RGB combina tres colores.</text></rect><rect x="35" y="413" width="830" height="105" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="445" r="21" fill="#186a4a"/><text x="67" y="452" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">3</text><text x="100" y="443" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Adquisición con cámara</text><text x="100" y="471" font-family="Arial,sans-serif" font-size="18" fill="#424d46">La cámara captura luz y convierte escenas en datos.</text></rect><rect x="30" y="543" width="840" height="38" rx="8" fill="#155d42"/><text x="48" y="570" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">PROCESAMIENTO Y APRENDIZAJE</text><rect x="35" y="592" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="624" r="21" fill="#186a4a"/><text x="67" y="631" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">4</text><text x="100" y="622" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Preprocesamiento</text><text x="100" y="650" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Prepara las imágenes para analizarlas de forma constante.</text></rect><rect x="35" y="700" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="732" r="21" fill="#186a4a"/><text x="67" y="739" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">5</text><text x="100" y="730" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Reducción de ruido</text><text x="100" y="758" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Elimina variaciones no deseadas sin perder información importante.</text></rect><rect x="35" y="808" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="840" r="21" fill="#186a4a"/><text x="67" y="847" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">6</text><text x="100" y="838" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Segmentación</text><text x="100" y="866" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Separa objetos o regiones relevantes dentro de la imagen.</text></rect><rect x="35" y="916" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="948" r="21" fill="#186a4a"/><text x="67" y="955" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">7</text><text x="100" y="946" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Extracción de características</text><text x="100" y="974" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Identifica patrones visuales útiles para reconocer imágenes.</text></rect><rect x="35" y="1024" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1056" r="21" fill="#186a4a"/><text x="67" y="1063" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">8</text><text x="100" y="1054" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Visión artificial</text><text x="100" y="1082" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Permite a las máquinas interpretar información visual.</text></rect><rect x="35" y="1132" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1164" r="21" fill="#186a4a"/><text x="67" y="1171" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">9</text><text x="100" y="1162" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Aprendizaje automático</text><text x="100" y="1190" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Aprende relaciones a partir de ejemplos y datos.</text></rect><rect x="35" y="1240" width="830" height="97" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1272" r="21" fill="#186a4a"/><text x="67" y="1279" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">10</text><text x="100" y="1270" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Redes CNN</text><text x="100" y="1298" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Detecta patrones mediante capas convolucionales jerárquicas.</text></rect><rect x="30" y="1362" width="840" height="38" rx="8" fill="#e18a32"/><text x="48" y="1389" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">DOS APLICACIONES DISTINTAS</text><text x="52" y="1429" font-family="Arial,sans-serif" font-size="19" fill="#155d42" font-weight="bold">RECONOCER</text><text x="480" y="1429" font-family="Arial,sans-serif" font-size="19" fill="#d66d1e" font-weight="bold">GENERAR</text><rect x="35" y="1439" width="400" height="95" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1471" r="21" fill="#186a4a"/><text x="67" y="1478" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">11</text><text x="100" y="1469" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1f2924">Clasificación</text><text x="100" y="1497" font-family="Arial,sans-serif" font-size="16" fill="#424d46">Asigna una categoría a la imagen completa.</text></rect><rect x="35" y="1549" width="400" height="95" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1581" r="21" fill="#186a4a"/><text x="67" y="1588" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">12</text><text x="100" y="1579" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1f2924">Detección</text><text x="100" y="1607" font-family="Arial,sans-serif" font-size="16" fill="#424d46">Localiza objetos y categorías dentro de una</text><text x="100" y="1630" font-family="Arial,sans-serif" font-size="16" fill="#424d46">imagen.</text></rect><rect x="465" y="1439" width="400" height="95" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="497" cy="1471" r="21" fill="#e28b32"/><text x="497" y="1478" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">13</text><text x="530" y="1469" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1f2924">Modelos generativos</text><text x="530" y="1497" font-family="Arial,sans-serif" font-size="16" fill="#424d46">Aprenden distribuciones para crear imágenes</text><text x="530" y="1520" font-family="Arial,sans-serif" font-size="16" fill="#424d46">nuevas y plausibles.</text></rect><rect x="465" y="1779" width="400" height="95" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="497" cy="1811" r="21" fill="#e28b32"/><text x="497" y="1818" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">14</text><text x="530" y="1809" font-family="Arial,sans-serif" font-size="19" font-weight="bold" fill="#1f2924">GAN y difusión</text><text x="530" y="1837" font-family="Arial,sans-serif" font-size="16" fill="#424d46">Generan imágenes mediante competencia o</text><text x="530" y="1860" font-family="Arial,sans-serif" font-size="16" fill="#424d46">eliminación progresiva de ruido.</text></rect><rect x="30" y="1688" width="840" height="38" rx="8" fill="#155d42"/><text x="48" y="1715" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="white">IMPACTO</text><rect x="35" y="1737" width="830" height="105" rx="9" fill="#ffffff" stroke="#d3e1da" stroke-width="2"/><circle cx="67" cy="1769" r="21" fill="#186a4a"/><text x="67" y="1776" font-family="Arial,sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="white">15</text><text x="100" y="1767" font-family="Arial,sans-serif" font-size="22" font-weight="bold" fill="#1f2924">Aplicación empresarial</text><text x="100" y="1795" font-family="Arial,sans-serif" font-size="18" fill="#424d46">Agricultura de precisión y control de calidad.</text></rect><text x="45" y="1876" font-family="Arial,sans-serif" font-size="16" fill="#4b5b51">LeCun et al. (2015); Goodfellow et al. (2014); Ho et al. (2020).</text></svg>